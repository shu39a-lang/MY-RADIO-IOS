workflows:
  ios-compile-check:
    name: MY RADIO / iOS compile check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Compile simulator app
        script: |
          xcodebuild -project MyRadio.xcodeproj -scheme MyRadio -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  ios-testflight:
    name: MY RADIO / TestFlight (requires Apple signing setup)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.myradio.personal
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Apply Apple signing profile
        script: xcode-project use-profiles
      - name: Create signed IPA
        script: xcode-project build-ipa --project MyRadio.xcodeproj --scheme MyRadio
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
