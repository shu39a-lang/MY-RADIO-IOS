name: MyRadio
options:
  bundleIdPrefix: jp.myradio
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.4.7'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: ''
targets:
  MyRadio:
    type: application
    platform: iOS
    sources:
      - path: MyRadio
        excludes:
          - Info.plist
          - radio.html
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.myradio.personal
        INFOPLIST_KEY_CFBundleDisplayName: マイラジオ
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: MyRadio/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [myradio]

